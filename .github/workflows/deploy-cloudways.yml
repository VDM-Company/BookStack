name: Deploy to Cloudways

# Builds the application on the runner and ships the result to Cloudways over
# SSH. Nothing is built on the production server: it needs no Node toolchain
# and no devDependencies, and a broken build fails here rather than half-way
# through a deploy.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDWAYS_SSH_KEY    private key whose public half is on the Cloudways app
#   CLOUDWAYS_HOST       server address, e.g. 123.45.67.89
#   CLOUDWAYS_USER       SSH user, e.g. master_abcdefghij
#   CLOUDWAYS_APP_PATH   absolute app root, e.g.
#                        /home/master/applications/abcdefghij/public_html
#
# Optional secret:
#   PRODUCTION_URL       https://docs.example.com — enables the health check.
#                        Held as a secret, so GitHub masks it as *** in the
#                        job log; that is cosmetic only.

# Runs automatically on every push to release-custom, and can still be started
# by hand for a dry run or to skip migrations.
#
# An automatic run is a REAL deploy: it is never a dry run, and it always
# migrates. There is no checkbox to forget, which is the point — but it also
# means anything pushed to release-custom reaches production. Push to a feature
# branch and merge when ready, rather than pushing here to "see if it works".
on:
  push:
    branches:
      - release-custom
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — list what would change, transfer nothing"
        type: boolean
        default: true
      run_migrations:
        description: "Run database migrations"
        type: boolean
        default: true

# Never let two deploys interleave on the same server. Queue instead of
# cancelling: a cancelled deploy could leave the app in maintenance mode.
concurrency:
  group: deploy-cloudways-production
  cancel-in-progress: false

env:
  # Matches the composer.json platform pin, so vendor/ resolves for PHP 8.2+
  # regardless of what the runner or the Cloudways server happens to run.
  PHP_VERSION: "8.2"
  # Matches the Node used by the dev container (node:22-alpine).
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    # The two deploy switches, resolved once here so no step has to know which
    # event started the run.
    #
    # `inputs` does not exist on a push event, so reading inputs.* directly in
    # the steps would yield an empty string there. That is quietly dangerous
    # for run_migrations: the remote script compares it against "true", so
    # every automatic deploy would have shipped new code and skipped its
    # migrations.
    #
    # Written as explicit comparisons rather than the usual
    # `cond && inputs.x || default` idiom, which returns the default whenever
    # the middle operand is false — that would force migrations back on even
    # when the operator deliberately unticked the box.
    #
    # Both resolve to the strings "true"/"false", which is what the step
    # conditions and the shell comparisons below expect.
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
      RUN_MIGRATIONS: ${{ github.event_name != 'workflow_dispatch' || inputs.run_migrations == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          # The ext-* requirements declared in composer.json. composer.json
          # pins config.platform.php but not the extensions, so these must be
          # genuinely present or `composer install` refuses to resolve.
          extensions: curl, dom, fileinfo, gd, json, mbstring, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies
        # `npm ci` needs package-lock.json to agree with package.json. It also
        # installs devDependencies, which is correct here — esbuild, sass and
        # npm-run-all are all devDependencies and the build cannot run without
        # them. None of this reaches the server.
        run: npm ci

      - name: Build production assets
        # `production`, not `build`. `build` is the dev target: it skips
        # minification and embeds sources, producing several times the bytes.
        run: npm run production

      - name: Verify build output
        # public/dist is not tracked in git, so if this step is wrong the
        # deploy would ship an app with no CSS or JS at all. Fail loudly here.
        run: |
          set -euo pipefail
          missing=0
          for f in app.js code.js legacy-modes.js markdown.js wysiwyg.js \
                   styles.css export-styles.css; do
            if [ ! -s "public/dist/$f" ]; then
              echo "::error::public/dist/$f is missing or empty"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Built assets:"
          ls -lh public/dist/*.js public/dist/*.css

      # ------------------------------------------------------------------ ssh

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.CLOUDWAYS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CLOUDWAYS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Confirm the secret actually holds a usable PRIVATE key before we
          # try to authenticate with it. A public key pasted here parses as a
          # key file but cannot sign, producing a baffling "Permission denied".
          if ! ssh-keygen -y -P "" -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::CLOUDWAYS_SSH_KEY is not a usable passphrase-free private key."
            echo "It must be the PRIVATE half (-----BEGIN ... PRIVATE KEY-----),"
            echo "not the ssh-rsa/ssh-ed25519 public key, and must have no passphrase."
            exit 1
          fi
          echo "Deploy key: $(ssh-keygen -l -f ~/.ssh/deploy_key)"

          # Trust-on-first-use. ssh-keyscan can fail transiently, and its
          # stderr was previously discarded, which turned any failure into a
          # silent step error. Retry, and show why when it does not work.
          for attempt in 1 2 3; do
            ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err || true
            if [ -s ~/.ssh/known_hosts ]; then
              echo "Host key scanned on attempt $attempt."
              break
            fi
            echo "ssh-keyscan attempt $attempt produced no host key:"
            cat /tmp/keyscan.err || true
            [ "$attempt" -lt 3 ] && sleep 5
          done
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Could not retrieve the host key for the server."
            echo "The host may be unreachable on port 22 from GitHub's runners,"
            echo "or blocking them. Check CLOUDWAYS_HOST and any firewall rules."
            exit 1
          fi

          cat >> ~/.ssh/config <<'SSHCONF'
          Host cloudways
            User ${{ secrets.CLOUDWAYS_USER }}
            HostName ${{ secrets.CLOUDWAYS_HOST }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            # Fail immediately on a rejected key instead of falling back to an
            # interactive password prompt, which only produces a confusing
            # "Permission denied, please try again." in a non-interactive job.
            PreferredAuthentications publickey
            PasswordAuthentication no
            BatchMode yes
          SSHCONF
          chmod 600 ~/.ssh/config

      - name: Verify connection and app path
        env:
          APP_PATH: ${{ secrets.CLOUDWAYS_APP_PATH }}
        run: |
          set -euo pipefail

          # Check authentication on its own first. Folding this into the
          # artisan test made an auth failure report itself as a bad path.
          if ! ssh cloudways 'echo ok' >/dev/null 2>&1; then
            echo "::error::SSH authentication to Cloudways failed (publickey rejected)."
            echo "The host was reachable — its key was scanned in the previous step —"
            echo "so this is authentication, not networking. Check, in order:"
            echo "  1. The PUBLIC half of CLOUDWAYS_SSH_KEY is installed on Cloudways."
            echo "     Server Management > SSH Public Keys, or the application's own key."
            echo "  2. CLOUDWAYS_USER matches the user that key belongs to."
            echo "     Master and application users are different accounts."
            echo "  3. CLOUDWAYS_SSH_KEY holds the PRIVATE key, including its"
            echo "     BEGIN/END lines and a trailing newline."
            exit 1
          fi
          echo "SSH authentication OK."

          if ! ssh cloudways "test -f '$APP_PATH/artisan'"; then
            echo "::error::Connected, but no artisan file at CLOUDWAYS_APP_PATH."
            echo "Directory listing one level up, to help locate the app root:"
            ssh cloudways "ls -la \"\$(dirname '$APP_PATH')\"" || true
            exit 1
          fi
          echo "Found artisan at $APP_PATH."

          echo "Remote PHP: $(ssh cloudways 'php -v | head -1')"
          ssh cloudways "command -v rsync >/dev/null" \
            || { echo "::error::rsync is not installed on the server"; exit 1; }

      # -------------------------------------------------------------- deploy

      - name: Enable maintenance mode
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          ssh cloudways "cd '${{ secrets.CLOUDWAYS_APP_PATH }}' && php artisan down --retry=60" || true

      - name: Sync files
        id: sync
        # --delete removes files upstream has dropped. Every --exclude below is
        # also protected from that deletion, which is what keeps production
        # data safe:
        #   .env                  production config, never overwritten
        #   public/uploads        images  (STORAGE_TYPE=local)
        #   storage/uploads       images + attachments (local_secure*)
        #   storage/app|backups   application data and backups
        #   storage/framework     cache, sessions, compiled views, the `down` flag
        #   storage/logs          logs
        #   bootstrap/cache       environment state; regenerated below
        #   public/favicon.ico    generated by FaviconHandler from the admin's
        #                         uploaded app icon, and gitignored, so CI never
        #                         has it and --delete would drop the custom icon
        #   public/robots.txt     a physical file here overrides BookStack's
        #                         route-served robots.txt; preserve whatever the
        #                         server already has rather than changing it
        #   storage/fonts/*.json  dompdf font-metric caches; harmless to lose but
        #                         pointless to churn. The dompdf/ subdirectory
        #                         itself still deploys so its placeholders exist.
        #
        # Themes get an include/exclude pair rather than a list of names. Only
        # themes/refresh is tracked in git, so every other theme directory is
        # absent from the runner and --delete would remove it from the server.
        # Production currently holds a `custom` theme that CI knows nothing
        # about. Naming each one is fragile; `--include=/themes/refresh/***`
        # ahead of `--exclude=/themes/*` deploys ours and leaves every other
        # theme untouched, whatever it happens to be called. Order matters:
        # rsync applies the first matching rule.
        #
        # dev/ is deliberately NOT excluded: MetaController reads
        # dev/licensing/*.txt at runtime to render the /licenses page.
        env:
          APP_PATH: ${{ secrets.CLOUDWAYS_APP_PATH }}
        run: |
          set -euo pipefail

          # About half this app's directories are owned by a different system
          # user (master_*) while we connect as the application user. Creating
          # and deleting files inside them is allowed; writing their metadata
          # is not. So rsync can set neither directory times nor permissions,
          # and exits 23 despite transferring every file correctly. That exit
          # code once skipped the migration step and left the app deployed but
          # un-migrated. --omit-dir-times and --no-perms remove both causes.
          # File mtimes are still preserved, which rsync's quick-check needs on
          # later runs.
          # Every element is quoted. The patterns contain * and ***, which the
          # shell would otherwise attempt to glob before rsync ever sees them.
          FILTERS=(
            '--exclude=/.git'
            '--exclude=/.github'
            '--exclude=/.forgejo'
            '--exclude=/.idea'
            '--exclude=/node_modules'
            '--exclude=/tests'
            '--exclude=/.env'
            '--exclude=/storage/app'
            '--exclude=/storage/backups'
            '--exclude=/storage/clockwork'
            '--exclude=/storage/framework'
            '--exclude=/storage/logs'
            '--exclude=/storage/uploads'
            '--exclude=/storage/fonts/dompdf/cache'
            '--exclude=/public/uploads'
            '--exclude=/public/plugins'
            '--exclude=/public/favicon.ico'
            '--exclude=/public/robots.txt'
            '--exclude=/storage/fonts/*.json'
            '--exclude=/bootstrap/cache'
            '--include=/themes/refresh/***'
            '--exclude=/themes/*'
          )
          BASE=(-az --omit-dir-times --no-perms --delete --human-readable)
          DEST="cloudways:$APP_PATH/"

          if [ "$DRY_RUN" = "true" ]; then
            rsync "${BASE[@]}" --dry-run --itemize-changes "${FILTERS[@]}" ./ "$DEST"
            exit 0
          fi

          set +e
          rsync "${BASE[@]}" "${FILTERS[@]}" ./ "$DEST"
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "Sync completed cleanly."
            exit 0
          fi
          if [ "$rc" -ne 23 ] && [ "$rc" -ne 24 ]; then
            echo "::error::rsync failed with exit code $rc"
            exit "$rc"
          fi

          # 23/24 mean some attributes were skipped or a file vanished mid-run.
          # Expected here, but not assumed harmless: prove no file *content* is
          # still out of sync before allowing migrations to proceed. Treating
          # 23 as success unconditionally would risk deploying a partial tree.
          echo "::warning::rsync exited $rc (metadata could not be written). Verifying content..."
          pending=$(rsync "${BASE[@]}" --dry-run --itemize-changes "${FILTERS[@]}" ./ "$DEST" \
                      | grep -cE '^([<>ch]|\*deleting)' || true)
          if [ "$pending" -eq 0 ]; then
            echo "Verified: every file is in sync. Continuing."
          else
            echo "::error::$pending path(s) still differ after rsync exited $rc."
            rsync "${BASE[@]}" --dry-run --itemize-changes "${FILTERS[@]}" ./ "$DEST" \
              | grep -E '^([<>ch]|\*deleting)' | head -30
            exit 1
          fi

      - name: Migrate and refresh caches
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          APP_PATH: ${{ secrets.CLOUDWAYS_APP_PATH }}
        run: |
          set -euo pipefail
          ssh cloudways "APP_PATH='$APP_PATH' RUN_MIGRATIONS='$RUN_MIGRATIONS' bash -euo pipefail -s" <<'REMOTE'
            cd "$APP_PATH"

            # bootstrap/cache is excluded from the sync, so its compiled
            # package manifest still describes the previous vendor/ tree.
            # Rebuild it against what was just deployed.
            php artisan clear-compiled
            php artisan package:discover --ansi

            if [ "$RUN_MIGRATIONS" = "true" ]; then
              php artisan migrate --force
            else
              echo "Migrations skipped by request."
            fi

            php artisan cache:clear
            php artisan config:clear
            php artisan view:clear
          REMOTE

      - name: Disable maintenance mode
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          ssh cloudways "cd '${{ secrets.CLOUDWAYS_APP_PATH }}' && php artisan up"

      # ------------------------------------------------------------- verify

      - name: Health check
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          # The `secrets` context is not available in `if:` conditions, so the
          # "is it configured?" test has to happen in the shell instead.
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_URL:-}" ]; then
            echo "PRODUCTION_URL is not set — skipping health check."
            exit 0
          fi
          # -L follows redirects and reports the code of the FINAL response.
          # Without it a PRODUCTION_URL of http://... reports the 301 to https
          # and the check fails against a perfectly healthy site. Trailing
          # slashes redirect too, so this also makes the URL format forgiving.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sL --max-redirs 5 -o /dev/null -w '%{http_code}' --max-time 20 "${PRODUCTION_URL%/}/login" || echo 000)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Site is up."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check never returned 200 — site may still be down"
          exit 1

      # If a step failed after maintenance mode went on, decide carefully
      # whether to reopen. Lifting maintenance after an incomplete sync serves
      # a half-deployed application, which is worse than a controlled outage:
      # that is exactly what happened when rsync exited 23 on directory times
      # and the site came back up with both migrations still pending.
      - name: Recover from failed deploy
        if: ${{ failure() && env.DRY_RUN != 'true' }}
        env:
          APP_PATH: ${{ secrets.CLOUDWAYS_APP_PATH }}
        run: |
          if [ "${{ steps.sync.outcome }}" = "success" ]; then
            echo "::warning::Deploy failed after the files synced. Lifting maintenance mode."
            echo "Files are current but migrations/caches may not have run — verify the site."
            ssh cloudways "cd '$APP_PATH' && php artisan up" || true
          else
            echo "::error::The file sync did not complete. LEAVING THE SITE IN MAINTENANCE MODE."
            echo "Reopening now would serve a partially deployed application."
            echo "Investigate, then either re-run this workflow or lift it manually with:"
            echo "  ssh <user>@<host> \"cd <app_path> && php artisan up\""
          fi

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
